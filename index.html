<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutina Setmanal</title>
    <link rel="stylesheet" href="palettes.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header class="header">
        <h1>Rutina Setmanal</h1>
        <div class="header-actions" style="display: flex; gap: 8px; position: relative;">
            <button id="share-toggle" class="btn btn-secondary btn-icon" aria-label="Comparteix la rutina">
                <i data-lucide="share-2"></i>
            </button>
            <div id="share-popup" class="share-popup">
                <span class="share-label">Enllaç:</span>
                <input type="text" id="share-url-input" class="share-input" readonly />
                <button id="share-copy-btn" class="btn btn-secondary btn-icon" aria-label="Copiar enllaç" style="padding: 6px;">
                    <i data-lucide="copy" style="width: 16px; height: 16px;"></i>
                </button>
            </div>
            <button id="config-toggle" class="btn btn-secondary btn-icon" aria-label="Configuració">
                <i data-lucide="settings"></i>
            </button>
            <button id="theme-toggle" class="btn btn-secondary btn-icon" aria-label="Canvia el tema">
                <i data-lucide="moon" id="theme-icon"></i>
            </button>
        </div>
    </header>

    <main class="calendar-container">
        <div class="calendar-header">
            <div class="time-zone-col">Hora</div>
            <div class="day-col" data-day="0">Dll</div>
            <div class="day-col" data-day="1">Dt</div>
            <div class="day-col" data-day="2">Dc</div>
            <div class="day-col" data-day="3">Dj</div>
            <div class="day-col" data-day="4">Dv</div>
            <div class="day-col" data-day="5">Ds</div>
            <div class="day-col" data-day="6">Dg</div>
        </div>
        <div class="calendar-body" id="calendar-body">
            <!-- Grid generated by JS -->
        </div>
    </main>

    <!-- Modal for adding/editing tasks -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h2 id="modal-title">Nova rutina</h2>
            <form id="event-form">
                <input type="hidden" id="event-id">
                
                <div class="form-group">
                    <label for="event-name">Títol</label>
                    <input type="text" id="event-name" required placeholder="Afegeix títol">
                </div>
                
                <div class="form-group">
                    <label for="event-desc">Descripció</label>
                    <input type="text" id="event-desc" placeholder="Afegeix una descripció">
                </div>

                <div class="form-group">
                    <label for="event-day">Dia</label>
                    <select id="event-day">
                        <option value="0">Dilluns</option>
                        <option value="1">Dimarts</option>
                        <option value="2">Dimecres</option>
                        <option value="3">Dijous</option>
                        <option value="4">Divendres</option>
                        <option value="5">Dissabte</option>
                        <option value="6">Diumenge</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="event-start">Hora d'inici</label>
                        <select id="event-start"></select>
                    </div>
                    <div class="form-group">
                        <label for="event-end">Hora final</label>
                        <select id="event-end"></select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Color</label>
                    <div class="color-picker" id="color-picker">
                        <div class="color-option default selected" data-color="default"></div>
                        <div class="color-option gray" data-color="gray"></div>
                        <div class="color-option brown" data-color="brown"></div>
                        <div class="color-option orange" data-color="orange"></div>
                        <div class="color-option yellow" data-color="yellow"></div>
                        <div class="color-option green" data-color="green"></div>
                        <div class="color-option blue" data-color="blue"></div>
                        <div class="color-option purple" data-color="purple"></div>
                        <div class="color-option pink" data-color="pink"></div>
                        <div class="color-option red" data-color="red"></div>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-danger" id="btn-delete" style="display: none;">Eliminar</button>
                    <div class="actions-right">
                        <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel·lar</button>
                        <button type="submit" class="btn btn-primary" id="btn-save">Desar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for configuration -->
    <div class="modal-overlay" id="config-modal-overlay">
        <div class="modal">
            <h2>Configuració</h2>
            <form id="config-form">
                <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                    <label for="config-hide-weekend" style="margin: 0; font-size: 14px; font-weight: 500; color: var(--color-text-default);">Amaga el cap de setmana</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="config-hide-weekend">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="form-row" style="margin-top: 16px;">
                    <div class="form-group">
                        <label for="config-start-hour">Mostra des de les</label>
                        <select id="config-start-hour"></select>
                    </div>
                    <div class="form-group">
                        <label for="config-end-hour">fins a les</label>
                        <select id="config-end-hour"></select>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 16px;">
                    <label style="margin-bottom: 8px;">Disseny de la cel·la</label>
                    <div class="segmented-control">
                        <input type="radio" id="design-default" name="cell-design" value="default" checked>
                        <label for="design-default">Per defecte</label>
                        <input type="radio" id="design-centered" name="cell-design" value="centered">
                        <label for="design-centered">Centrat</label>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 16px;">
                    <label for="config-palette" style="margin-bottom: 8px;">Paleta de colors</label>
                    <select id="config-palette">
                        <option value="vibrant">Vibrant</option>
                        <option value="pastel">Pastel</option>
                        <option value="autumn">Tardor</option>
                        <option value="ocean">Navy</option>
                        <option value="monochrome">Monocromàtica</option>
                        <option value="neon">Neon</option>
                        <option value="rock">Rock</option>
                        <option value="ghibli">Studio Ghibli</option>
                        <option value="notion">Notion</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <div class="actions-right">
                        <button type="button" class="btn btn-secondary" id="btn-config-cancel">Cancel·lar</button>
                        <button type="submit" class="btn btn-primary" id="btn-config-save">Desar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
